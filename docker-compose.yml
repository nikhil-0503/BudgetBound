version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: budgetbound_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: budgetbound
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: budgetbound_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/budgetbound
      - JWT_SECRET_KEY=budgetbound_super_secret_signing_key_2026_dev
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: budgetbound_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
